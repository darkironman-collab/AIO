name: Build Original AIOStreams Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  AIOSTREAMS_IMAGE: viren070/aiostreams:v2.32

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle original AIOStreams ARM64 runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets app/src/main/jniLibs/arm64-v8a
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/proot-me/proot-static-build/master/static/proot-arm64 \
            -o app/src/main/jniLibs/arm64-v8a/libproot.so
          chmod 0755 app/src/main/jniLibs/arm64-v8a/libproot.so
          docker pull --platform linux/arm64 "$AIOSTREAMS_IMAGE"
          cid="$(docker create --platform linux/arm64 "$AIOSTREAMS_IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" | gzip -1 > app/src/main/assets/aiostreams-rootfs.tar.gz
          docker rm "$cid"
          trap - EXIT
          test -s app/src/main/assets/aiostreams-rootfs.tar.gz
          test -s app/src/main/jniLibs/arm64-v8a/libproot.so
          ls -lh app/src/main/assets/aiostreams-rootfs.tar.gz app/src/main/jniLibs/arm64-v8a/libproot.so

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Inspect and prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          echo '--- APK size ---'
          ls -lh "$apk"
          echo '--- Runtime in Gradle intermediates ---'
          find app/build -type f -iname '*aiostreams*' -o -iname '*rootfs*' | head -50 || true
          echo '--- APK assets/native runtime entries ---'
          unzip -Z1 "$apk" > /tmp/apk-files.txt
          grep -E '(^assets/|lib/arm64-v8a/libproot)' /tmp/apk-files.txt | tail -100 || true
          cp "$apk" AIOStreams-Android-v1.1-arm64-debug.apk
          sha256sum AIOStreams-Android-v1.1-arm64-debug.apk > AIOStreams-Android-v1.1-arm64-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AIOStreams-Android-v1.1-arm64-diagnostic
          path: |
            AIOStreams-Android-v1.1-arm64-debug.apk
            AIOStreams-Android-v1.1-arm64-debug.apk.sha256
          retention-days: 7
